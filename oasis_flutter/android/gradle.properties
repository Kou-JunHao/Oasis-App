org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Workaround: some Linux system Flutter SDK installs are read-only under /usr/lib/flutter,
# which can break Kotlin compiler session files inside flutter_tools/gradle/.kotlin.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.project.persistent.dir=.kotlin
